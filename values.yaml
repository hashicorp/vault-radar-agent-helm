# Default values for agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: docker.io/hashicorp
  repository: vault-radar
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

rbac:
  enabled: false

serviceAccount:
  name: ""
  create: true
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables (shared across all workers)
env:
  normal:
    HCP_API_ADDRESS: api.cloud.hashicorp.com
    HCP_AUTH_URL: https://auth.idp.hashicorp.com
    HCP_PROJECT_ID: ""
    HCP_RADAR_AGENT_POOL_ID: ""
    HCP_CLIENT_ID: ""
  secrets:
    HCP_CLIENT_SECRET: ""
    VAULT_RADAR_GIT_TOKEN: ""
  optional:
    VAULT_RADAR_LOG_LEVEL: "info"

# Each worker creates a separate Deployment within the same release
# This allows different job types to have different scaling and resource configurations
workers:
  # Default values applied to all workers unless overridden
  defaults:
    replicaCount: 1
    resources:
      limits:
        cpu: 1000m
        memory: 3072Mi
      requests:
        cpu: 100m
        memory: 1024Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podLabels: {}

  # Worker definitions
  items:
    # Default worker -- suitable for most scanning workloads
    default:
      enabled: true
      name: "default"
      # replicaCount: 1 # Uses defaults.replicaCount if not specified
      # resources: {}  # Uses defaults.resources if not specified
      env:
        AGENT_SERVICE_DISABLE_LIST: ""

    # prScan:
    #   enabled: true
