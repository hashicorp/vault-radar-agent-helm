# Default values for Vault Radar Agent.

image:
  registry: docker.io/hashicorp
  repository: vault-radar
  pullPolicy: IfNotPresent
  tag: "" # Overrides the image tag whose default is the chart appVersion

imagePullSecrets: [] # Secrets for pulling images from private registries
# - name: myRegistryKeySecretName

nameOverride: "" # Override the chart name used in labels
fullnameOverride: "" # Override the full resource name prefix

# Pod-level security context (applies to all containers in the pod)
podSecurityContext:
  runAsNonRoot: true

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Enable RBAC resources for Vault Kubernetes auth
rbac:
  enabled: false

serviceAccount:
  create: true
  name: "" # Leave empty to auto-generate from release name

# Environment variables (shared across all workers)
env:
  normal:
    HCP_API_ADDRESS: api.cloud.hashicorp.com
    HCP_AUTH_URL: https://auth.idp.hashicorp.com
    HCP_PROJECT_ID: ""
    HCP_RADAR_AGENT_POOL_ID: ""
    HCP_CLIENT_ID: ""
  secrets:
    HCP_CLIENT_SECRET: ""
    VAULT_RADAR_GIT_TOKEN: ""
  optional:
    VAULT_RADAR_LOG_LEVEL: "info" # or debug, warn, error

# Each worker creates a separate Deployment within the same release
# This allows different job types to have different scaling and resource configurations
workers:
  # Default values applied to all workers unless overridden
  defaults:
    replicaCount: 1
    resources:
      limits:
        cpu: 1000m
        memory: 3072Mi
      requests:
        cpu: 100m
        memory: 1024Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podLabels: {}

  # Worker definitions
  items:
    # Default worker -- suitable for most scanning workloads
    default:
      enabled: true
      name: "default"
      # replicaCount: 1 # Uses defaults.replicaCount if not specified
      # resources: # Uses defaults.resources if not specified
      #   limits:
      #     cpu: 1000m
      #     memory: 3072Mi
      #   requests:
      #     cpu: 100m
      #     memory: 1024Mi
      env:
        AGENT_SERVICE_DISABLE_LIST: ""

    # prScan:
    #   enabled: true
